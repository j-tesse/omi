# Static download server for the Android builds in results/app/ (scripts/build_app.sh).
# The phone reaches it as http://<OMI_PUBLIC_HOST>/app/ through the mobile-access
# vhost (deploy/nginx/omi.conf.template), which strips the /app/ prefix.
server {
    listen 8080;
    server_name _;
    root /srv/app;

    # nginx's stock mime.types has no entry for APKs; Android's downloader and
    # package installer want this type (otherwise the file may be saved as .bin).
    types {
        application/vnd.android.package-archive apk;
        text/plain txt;
        text/html html;
    }
    default_type application/octet-stream;

    # Always revalidate: latest.apk and index.html change with every build.
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html @listing;
    }
    location @listing {
        autoindex on;
    }
    location / {
        autoindex on;
        autoindex_exact_size off;
        disable_symlinks off;
    }
}
