services:
  # Local CPU speech-to-text, wire-compatible with Omi's self-hosted Parakeet
  # service. Point the Omi backend at it with
  #   HOSTED_PARAKEET_API_URL=http://stt:8000  (STT_SERVICE_MODELS=parakeet)
  # Swap the model with STT_ENGINE in .env, then `docker compose up -d stt`.
  stt:
    build: ./services/stt
    image: omi-local-stt:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    cpus: ${STT_THREADS:-4}
    ports:
      - "127.0.0.1:${STT_PORT:-8100}:8000"
    volumes:
      - ./.cache/models:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  # Local CPU embedding server, OpenAI /v1/embeddings-compatible (replaces
  # text-embedding-3-large). Reached through llm-proxy, which routes
  # /v1/embeddings here, so the backend needs no extra setting.
  embed:
    build: ./services/embed
    image: omi-local-embed:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    cpus: ${EMBED_THREADS:-4}
    ports:
      - "127.0.0.1:${EMBED_PORT:-8102}:8000"
    volumes:
      - ./.cache/models:/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3

  # OpenAI-compatible pass-through to the host's vLLM that rewrites model
  # names (upstream Omi hardcodes gpt-6-luna / gpt-5-nano). Point the Omi
  # backend and llm_gateway at it with OPENAI_BASE_URL=http://llm-proxy:8000/v1.
  llm-proxy:
    build: ./services/llm-proxy
    image: omi-local-llm-proxy:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    depends_on:
      - embed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${LLM_PROXY_PORT:-8101}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Firebase Emulator Suite (Firestore + Auth + UI), replacing Firebase for the
  # Omi backend: FIRESTORE_EMULATOR_HOST=firebase:8103,
  # FIREBASE_AUTH_EMULATOR_HOST=firebase:8104. Ports are fixed in
  # services/firebase/firebase.json and published 1:1, because the Emulator UI
  # makes the browser connect to the emulators on their in-container ports.
  # Data is exported to state/firebase/ on a clean stop and imported on start.
  firebase:
    build: ./services/firebase
    image: omi-local-firebase:latest
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      JAVA_TOOL_OPTIONS: ${FIREBASE_JAVA_OPTS:--Xmx1g}
    init: true
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8103:8103"   # Firestore
      - "127.0.0.1:8104:8104"   # Auth
      - "127.0.0.1:8105:8105"   # Emulator UI
      - "127.0.0.1:8106:8106"   # Firestore UI websocket
      # Auth only, on docker0, for webserver_nginx (host.docker.internal): the
      # phone app signs in through the mobile-access vhost (deploy/nginx/).
      # Not on the LAN directly; nginx filters paths and client IPs.
      - "172.17.0.1:8104:8104"
    volumes:
      - ./state/firebase:/data
      - ./upstream/omi/firestore.rules:/config/firestore.rules:ro
      - ./upstream/omi/firestore.indexes.json:/config/firestore.indexes.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['http://127.0.0.1:8103/','http://127.0.0.1:8104/'].map(u=>fetch(u).then(r=>{if(!r.ok)throw 0}))).then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Redis (cache, rate limits, locks) for the Omi backend:
  # REDIS_DB_HOST=redis, REDIS_DB_PORT=6379, REDIS_DB_PASSWORD= (none).
  # AOF + RDB persistence in state/redis/ (create it first, owned by uid 1000).
  redis:
    image: redis:7.4.12-alpine
    restart: unless-stopped
    user: "1000:1000"
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data", "--save", "60 1", "--protected-mode", "no"]
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8107:6379"
    volumes:
      - ./state/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Typesense (conversation + memory keyword search) for the Omi backend:
  # TYPESENSE_HOST=typesense, TYPESENSE_HOST_PORT=8108, TYPESENSE_PROTOCOL=http,
  # TYPESENSE_API_KEY from .env. Pinned to the upstream dev harness version.
  # Data in state/typesense/ (create it first, owned by uid 1000).
  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8108:8108"
    volumes:
      - ./state/typesense:/data
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough for /health.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # One-shot: creates the `conversations` collection from upstream's schema
  # file if it doesn't exist yet (upstream never creates it). Idempotent; runs
  # on every `up`. The backend should depend on it with
  # condition: service_completed_successfully.
  typesense-init:
    image: curlimages/curl:8.17.0
    restart: "no"
    depends_on:
      typesense:
        condition: service_healthy
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env}
      TYPESENSE_URL: http://typesense:8108
    entrypoint: ["sh", "/init.sh"]
    volumes:
      - ./services/typesense/init.sh:/init.sh:ro
      - ./upstream/omi/backend/typesense/conversations.schema:/schemas/conversations.schema:ro

  # Omi backend (upstream/omi/backend, built from the submodule with upstream's
  # Dockerfile). The env mirrors the upstream dev harness
  # (scripts/dev-harness/dev_harness/config.py _harness_service_extra()), with
  # every dependency pointed at a container of this stack. llm-gateway runs the
  # same image and env with a different entrypoint, like the harness does.
  # Offline smoke test: OMI_ENV_STAGE=offline OMI_LLM_GATEWAY_FEATURE_MODE=off
  # OMI_STT_STUB=1 docker compose up -d backend
  backend:
    build:
      context: ./upstream/omi
      dockerfile: backend/Dockerfile
      args:
        # Upstream's default base (gcr.io/based-hardware-dev/...) is private.
        PYTHON_BASE_IMAGE: python:3.11-slim-trixie
    image: omi-local-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      llm-gateway: {condition: service_started}
      firebase: {condition: service_started}
      stt: {condition: service_started}
      llm-proxy: {condition: service_started}
      redis: {condition: service_started}
      typesense-init: {condition: service_completed_successfully}
    environment: &omi-backend-env
      OMI_ENV_STAGE: ${OMI_ENV_STAGE:-local}
      PROVIDER_MODE: ${OMI_PROVIDER_MODE:-real}
      ENVIRONMENT: local-docker
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
      # Harness markers: OMI_HARNESS_INSTANCE makes env_loader skip backend/.env
      # files (the env below is complete); OMI_HARNESS_STATE_ROOT bounds local storage.
      OMI_HARNESS_INSTANCE: docker
      OMI_HARNESS_STATE_ROOT: /state
      # Firebase emulators (services/firebase)
      FIRESTORE_EMULATOR_HOST: firebase:8103
      FIREBASE_AUTH_EMULATOR_HOST: firebase:8104
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-omi-local}
      FIREBASE_AUTH_PROJECT_ID: ${FIREBASE_PROJECT_ID:-demo-omi-local}
      FIRESTORE_DATABASE_ID: (default)
      FIREBASE_API_KEY: local-firebase-auth-emulator-api-key
      # Local filesystem storage instead of GCS, served at /_local/storage
      OMI_LOCAL_STORAGE_ROOT: /state/storage
      # The backend itself downloads these links (e.g. Parakeet batch STT), so the
      # URL must resolve inside the stack too, not only for clients.
      OMI_LOCAL_STORAGE_BASE_URL: ${OMI_LOCAL_STORAGE_BASE_URL:-http://backend:8080/_local/storage}
      BUCKET_SPEECH_PROFILES: speech-profiles
      BUCKET_POSTPROCESSING: postprocessing
      BUCKET_PRIVATE_CLOUD_SYNC: omi-private-cloud-sync
      BUCKET_TEMPORAL_SYNC_LOCAL: sync-temporal
      BUCKET_MEMORIES_RECORDINGS: memories-recordings
      BUCKET_PLUGINS_LOGOS: plugins-logos
      BUCKET_APP_THUMBNAILS: app-thumbnails
      BUCKET_CHAT_FILES: chat-files
      BUCKET_DESKTOP_UPDATES: desktop-updates
      BUCKET_SCREEN_FRAMES: screen-frames
      # Redis + Typesense (contract: redis:6379 no password, typesense:8108 http)
      REDIS_DB_HOST: redis
      REDIS_DB_PORT: "6379"
      REDIS_DB_PASSWORD: ""
      TYPESENSE_HOST: typesense
      TYPESENSE_HOST_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env}
      # LLMs: backend -> llm-gateway -> llm-proxy -> vLLM (embeddings -> embed)
      OPENAI_BASE_URL: http://llm-proxy:8000/v1
      OPENAI_API_KEY: ${OMI_OPENAI_API_KEY:-sk-local-llm-proxy-not-real}
      OMI_LLM_GATEWAY_URL: http://llm-gateway:8080
      OMI_LLM_GATEWAY_SERVICE_TOKEN: ${OMI_LLM_GATEWAY_SERVICE_TOKEN:?set OMI_LLM_GATEWAY_SERVICE_TOKEN in .env}
      OMI_LLM_GATEWAY_FEATURE_MODE: ${OMI_LLM_GATEWAY_FEATURE_MODE:-gateway}
      # Backend -> gateway first-byte deadline (upstream 15 s, tuned for OpenAI). Non-streamed
      # structured output from local Gemma can take longer, especially when vLLM is busy.
      OMI_LLM_GATEWAY_FIRST_BYTE_TIMEOUT_SECONDS: ${OMI_LLM_GATEWAY_FIRST_BYTE_TIMEOUT_SECONDS:-120}
      # STT: local Parakeet-compatible service (services/stt)
      STT_SERVICE_MODELS: parakeet
      HOSTED_PARAKEET_API_URL: http://stt:8000
      OMI_STT_STUB: ${OMI_STT_STUB:-}
      # Conversation enrichment (LLM summary, memories, embeddings) after sync:
      # with an emulator, upstream defers it to the enrichment outbox, which is
      # drained only by Cloud Tasks / Cloud Scheduler. These kill switches restore
      # the eager inline path, so synced conversations get processed locally.
      SYNC_PROCESSING_HOLD_ENABLED: "false"
      SYNC_REPROCESS_COALESCE_ENABLED: "false"
      # Live /v4/listen: without the Parakeet streaming slot every session closes
      # with transcription_service_unavailable (found by the pusher session).
      STT_STREAMING_PARAKEET_SLOT_ENABLED: "true"
      STT_PRERECORDED_MODEL: parakeet
      # The pre-recorded language guard asks Modulate (cloud) or the self-hosted
      # gate (/v2/language, 503 in our stt) for the language of users without a
      # single declared language, and routes "unknown" to Modulate. Our Parakeet
      # v3 detects EN/DE itself, so skip the guard and always use parakeet.
      STT_PRERECORDED_LANGUAGE_GUARD_ENABLED: ${STT_PRERECORDED_LANGUAGE_GUARD_ENABLED:-false}
      # Offline sync (/v2/sync-local-files): let recent uploads without a server
      # capture manifest take the inline "fresh" lane. Without Cloud Tasks the
      # "backfill" lane (older than SYNC_FRESH_MAX_AGE_SECONDS, default 6 h) is refused.
      SYNC_LEGACY_FRESH_ENABLED: ${SYNC_LEGACY_FRESH_ENABLED:-true}
      SYNC_LEGACY_FRESH_PERCENT: ${SYNC_LEGACY_FRESH_PERCENT:-100}
      # Set 'on' in every upstream deployment (deploy/runtime_env/*.overlay.yaml) but
      # not by the harness: the legacy notes path is gone, so without it every
      # conversation summary fails ("Shaped notes disabled").
      OMI_SHAPED_AGENT_MODE: "on"
      # Memory defaults from the harness
      # Memory intake fence (upstream default off = "Memory writes are globally paused").
      MEMORY_ENABLED: "on"
      MEMORY_MODE: read
      MEMORY_CANONICAL_CONSOLIDATION_ENABLED: "true"
      # Local secrets
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:?set ENCRYPTION_SECRET in .env}
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY in .env}
      SCREEN_FRAME_SIGNING_SECRET: ${SCREEN_FRAME_SIGNING_SECRET:?set SCREEN_FRAME_SIGNING_SECRET in .env}
      BASE_API_URL: http://backend:8080
      API_BASE_URL: http://backend:8080
      HOSTED_PUSHER_API_URL: ${HOSTED_PUSHER_API_URL:-}
      # Pinecone stays off (no PINECONE_API_KEY); optional providers stay unset.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8109}:8080"
      # Also on docker0 for webserver_nginx (host.docker.internal:8109), which
      # serves it to the phone via the mobile-access vhost (deploy/nginx/).
      - "172.17.0.1:${BACKEND_PORT:-8109}:8080"
    volumes:
      - ./state/storage:/state/storage
    tmpfs: &omi-backend-scratch
      # Relative scratch dirs under /app (main.py, sync.py). /app belongs to the
      # image's uid 10001, but we run as 1000 like the other services.
      - /app/_temp:mode=1777
      - /app/_samples:mode=1777
      - /app/_segments:mode=1777
      - /app/_speech_profiles:mode=1777
      - /app/syncing:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 5s
      start_period: 180s
      retries: 3

  # Upstream llm_gateway (same image and env as backend). Authenticates callers
  # with OMI_LLM_GATEWAY_SERVICE_TOKEN and calls {OPENAI_BASE_URL}/chat/completions.
  llm-gateway:
    image: omi-local-backend:latest
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      - llm-proxy
      - firebase
    environment: *omi-backend-env
    tmpfs: *omi-backend-scratch
    command: ["uvicorn", "llm_gateway.main:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:${LLM_GATEWAY_PORT:-8110}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # One-shot: seed the upstream harness's synthetic local users (alice, bob,
  # local_default_user, ...) and their happy_path memories into the emulators,
  # by running upstream's own seeder (scripts/dev-harness/seed-memory-scenario.py)
  # from the read-only submodule. It shares firebase's network namespace because
  # the harness only talks to 127.0.0.1:<port>. Idempotent.
  #   COMPOSE_PROJECT_NAME=omi docker compose run --rm --no-deps backend-seed [SCENARIO]
  backend-seed:
    image: omi-local-backend:latest
    profiles: ["tools"]
    user: "1000:1000"
    network_mode: "service:firebase"
    working_dir: /repo
    environment:
      HOME: /tmp
      PYTHONPATH: /repo/scripts/dev-harness
      OMI_LOCAL_STATE_ROOT: /state/harness
      OMI_HARNESS_FIRESTORE_PORT: "8103"
      OMI_HARNESS_AUTH_PORT: "8104"
      # Ports the seeder never contacts, moved off firebase's 8103/8104 range.
      OMI_HARNESS_REDIS_PORT: "6379"
    volumes:
      - ./upstream/omi:/repo:ro
      - ./state/harness:/state/harness
    entrypoint: ["python", "scripts/dev-harness/seed-memory-scenario.py"]
    command: ["happy_path"]
